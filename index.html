<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Version #33 Apr 26, 2026 10:30 AM -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trip Budget Tracker</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="app-container">

    <header>
      <h1>Trip Budget Tracker</h1>
      <div class="version">v33</div>
    </header>

    <!-- SETTINGS -->
    <section class="settings">

      <div class="settings-grid">

        <div>
          <label>Currency:</label>
          <select id="currencySelect">
            <option value="EUR">Euros (€)</option>
            <option value="CAD">Canadian Dollars ($)</option>
            <option value="USD">USA Dollars (US$)</option>
          </select>
        </div>

        <div>
          <label>Number of Days:</label>
          <input id="daysInput" type="number" value="40" />
        </div>

        <div class="day-number-block">
          <label>Day Number:</label>
          <div class="day-stepper-row">
            <button id="prevDayBtn">◀</button>
            <input id="dayNumberInput" value="D1" />
            <button id="nextDayBtn">▶</button>
          </div>
        </div>

      </div>

    </section>

    <!-- FOOD -->
    <section class="card food">

      <h2 id="foodHeading">
        <span class="section-main">Food - for D1</span>
      </h2>

      <input id="foodBudgetInput" type="text" value="1500" />

      <div class="summary-grid">

        <div>
          Daily:
          <span id="foodStartingDaily">0</span>
        </div>

        <div>
          Remaining:
          <span id="foodRemainingBudget">0</span>
          <span id="foodBudgetStatus" class="budget-status">0</span>
        </div>

        <div>
          Remaining Daily:
          <span id="foodRemainingDaily">0</span>
        </div>

        <div>
          Spent Today:
          <span id="foodSpentToday">0</span>
        </div>

      </div>

      <div class="entry-row">
        <select id="foodTypeSelect">
          <option>Breakfast</option>
          <option>Lunch</option>
          <option>Dinner</option>
        </select>

        <input id="foodAmountInput" placeholder="0.00" />

        <button id="addFoodBtn">Add Entry</button>
      </div>

      <div class="action-row">
        <button id="cancelFoodEditBtn" class="hidden">Cancel Edit</button>
      </div>

      <div id="foodEntriesList"></div>

    </section>

    <!-- ACCOMMODATION -->
    <section class="card accommodation">

      <h2 id="accommodationHeading">
        <span class="section-main">Accommodation - for D1</span>
      </h2>

      <input id="accommodationBudgetInput" type="text" value="900" />

      <div class="summary-grid">

        <div>
          Daily:
          <span id="accommodationStartingDaily">0</span>
        </div>

        <div>
          Remaining:
          <span id="accommodationRemainingBudget">0</span>
          <span id="accommodationBudgetStatus" class="budget-status">0</span>
        </div>

        <div>
          Remaining Daily:
          <span id="accommodationRemainingDaily">0</span>
        </div>

        <div>
          Spent Today:
          <span id="accommodationSpentToday">0</span>
        </div>

      </div>

      <div class="entry-row">
        <select id="accommodationTypeSelect">
          <option>Albergue</option>
          <option>Hotel</option>
        </select>

        <input id="accommodationAmountInput" placeholder="0.00" />

        <button id="addAccommodationBtn">Add Entry</button>
      </div>

      <div class="action-row">
        <button id="cancelAccommodationEditBtn" class="hidden">Cancel Edit</button>
      </div>

      <div id="accommodationEntriesList"></div>

    </section>

  </div>

  <script src="js/app.js"></script>

</body>
</html>
