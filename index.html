<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Version #33 Apr 26, 2026 8:15 AM -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trip Budget Tracker</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <h1>Trip Budget Tracker</h1>
      <div class="version-tag">v33</div>
    </header>

    <main class="app-main">

      <section class="settings-panel">
        <div class="settings-grid">

          <div class="field-block">
            <label>Currency:</label>
            <select id="currencySelect">
              <option value="EUR">Euros (€)</option>
              <option value="CAD">Canadian Dollars ($)</option>
              <option value="USD">USA Dollars (US$)</option>
            </select>
          </div>

          <div class="field-block">
            <label>Number of Days:</label>
            <input id="daysInput" type="number" value="40" />
          </div>

          <div class="field-block day-number-block">
            <label>Day Number:</label>
            <div class="day-stepper-row">
              <button id="prevDayBtn">◀</button>
              <input id="dayNumberInput" value="D1" />
              <button id="nextDayBtn">▶</button>
            </div>
          </div>

        </div>
      </section>

      <!-- FOOD -->
      <section class="budget-panel food-panel">

        <h2 class="section-title">
          <span id="foodHeadingText">Food - for D1</span>
        </h2>

        <input id="foodBudgetInput" value="1500" />

        <div class="summary-grid">
          <div>Daily: <span id="foodStartingDaily"></span></div>
          <div>
            Remaining:
            <span id="foodRemainingBudget"></span>
            <span id="foodBudgetStatus"></span>
          </div>
          <div>Remaining Daily: <span id="foodRemainingDaily"></span></div>
          <div>Spent Today: <span id="foodSpentToday"></span></div>
        </div>

        <div class="entry-row">
          <select id="foodTypeSelect">
            <option>Breakfast</option>
            <option>Lunch</option>
            <option>Dinner</option>
          </select>

          <input id="foodAmountInput" placeholder="0.00" />

          <button id="addFoodBtn">Add Entry</button>
        </div>

        <div class="action-row">
          <button id="cancelFoodEditBtn" class="hidden">Cancel Edit</button>
        </div>

        <div id="foodEntriesList"></div>
      </section>

      <!-- ACCOMMODATION -->
      <section class="budget-panel accommodation-panel">

        <h2 class="section-title">
          <span id="accHeadingText">Accommodation - for D1</span>
        </h2>

        <input id="accBudgetInput" value="900" />

        <div class="summary-grid">
          <div>Daily: <span id="accStartingDaily"></span></div>
          <div>
            Remaining:
            <span id="accRemainingBudget"></span>
            <span id="accBudgetStatus"></span>
          </div>
          <div>Remaining Daily: <span id="accRemainingDaily"></span></div>
          <div>Spent Today: <span id="accSpentToday"></span></div>
        </div>

        <div class="entry-row">
          <select id="accTypeSelect">
            <option>Albergue</option>
            <option>Hotel</option>
          </select>

          <input id="accAmountInput" placeholder="0.00" />

          <button id="addAccBtn">Add Entry</button>
        </div>

        <div class="action-row">
          <button id="cancelAccEditBtn" class="hidden">Cancel Edit</button>
        </div>

        <div id="accEntriesList"></div>
      </section>

    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
